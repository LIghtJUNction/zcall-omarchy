name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vMAJOR.MINOR.PATCH tag
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check source and isolated frontend fixtures
        run: python3 scripts/check.py
      - name: Build reproducible source and AUR recipe
        run: python3 scripts/release.py --ref "$RELEASE_TAG"
      - name: Publish immutable GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive=$(python3 -c 'import json; print(json.load(open("dist/release.json"))["archive"])')
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            previous=$(mktemp -d)
            trap 'rm -rf "$previous"' EXIT
            gh release download "$RELEASE_TAG" --dir "$previous" \
              --pattern "$archive" --pattern SHA256SUMS --pattern PKGBUILD --pattern zcall-omarchy.SRCINFO
            cmp "dist/$archive" "$previous/$archive"
            cmp dist/SHA256SUMS "$previous/SHA256SUMS"
            cmp dist/aur/PKGBUILD "$previous/PKGBUILD"
            cmp dist/zcall-omarchy.SRCINFO "$previous/zcall-omarchy.SRCINFO"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "Zcall for Omarchy ${RELEASE_TAG#v}" \
              "dist/$archive" dist/SHA256SUMS dist/aur/PKGBUILD dist/zcall-omarchy.SRCINFO
          fi
      - name: Publish AUR recipe
        if: vars.AUR_PUBLISH == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: scripts/publish-aur.sh dist/aur
